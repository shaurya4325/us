// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Builds with the Android SDK that ships with Unity (it has build-tools 36 only).
subprojects {
    afterEvaluate { p ->
        if (p.hasProperty('android')) {
            p.android.buildToolsVersion = (System.getenv("US_BUILD_TOOLS") ?: "36.0.0")
            p.android.lintOptions.checkReleaseBuilds = false
            p.android.lintOptions.abortOnError = false
        }
    }
}
